name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project shell
        run: flutter create --platforms=android --project-name pdf_toolkit --org com.pdftoolkit app_shell

      - name: Copy my code into the project
        run: |
          cp pubspec.yaml app_shell/pubspec.yaml
          rm -rf app_shell/lib
          cp -r lib app_shell/lib

      - name: Build APK
        working-directory: app_shell
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-toolkit-apk
          path: app_shell/build/app/outputs/flutter-apk/app-release.apk
